<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            margin: 0;
            width: 100vw;
            height: 100vh;
            background-color: gray;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        input::placeholder {
            color: #94a3b8;
        }

        canvas {
            width: 100%;
            height: 100%;
        }
        </style>
        <title>Shooting-game</title>
    </head>
    <body >
        <div>
        <div style="
            position: absolute;
            color:  white;
            padding: 8px;
            font-family: sans-serif;
            font-size: 14px;
            user-select: none;
            background: rgba(0,0,0,0.3);
            ">
            <div style="margin-bottom: 8px;">LeaderBoard : </div>
            <div id="player-label">
            </div>
        </div>
        <canvas></canvas> 

        <!-- username input -->
        <div 
            style="
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            "
        >
            <form id = "userForm">
                <div>
                    <input id="userInput"
                        type="text"
                        placeholder="Username"
                        style="
                        padding: 12px;
                        border-radius: 20px;
                        border: none;
                        background: #475569;
                        color: #cbd5e1;
                        "
                    />
                </div>
                <div style="text-align: center; margin-top: 8px">
                    <button
                        style="
                        padding: 8px 20px;
                        border-radius: 100px;
                        border: none;
                        background-image: linear-gradient(
                            to right,
                            rgb(6, 182, 212),
                            rgb(59, 130, 246)
                            );
                        color: white;
                        cursor: pointer;
                        "
                    >
                        Start!
                    </button>
                </div>
            </form>
        </div>
        </div>

        <script src="https://cdn.socket.io/4.8.4/socket.io.min.js" integrity="sha384-fBrXvbDtHoeKWJ/hcA6M+YGueiDW+h45I7V6F2kD1S8bOkrF9rZYPLVkCR6BLR/1" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
        <script src="player.js"></script>
        <script src="userRegistration.js"></script>
        <script src="projectile.js"></script>
        <script src="main.js"></script>
        <script src="projectileFire.js"></script>
        <script src="movement.js"></script>
    </body>
</html>
